<style>

/* =========================================
   BHAROSA — TRIRANGA SECURITY THEME
   ========================================= */

* {
    box-sizing: border-box;
}

:root {
    --bg-primary: #0D1117;
    --bg-card: #161B22;
    --bg-sidebar: #131A26;
    --bg-input: #202A36;

    --text-primary: #F1F5F9;
    --text-secondary: #CBD5E1;
    --text-muted: #94A3B8;

    --saffron: #FF9933;
    --saffron-light: #FFB347;

    --green: #138808;
    --green-light: #22C55E;

    --white: #FFFFFF;
    --off-white: #F5F7FA;

    --success: #22C55E;
    --warning: #F59E0B;
    --danger: #EF4444;
    --info: #3B82F6;

    --border: #263241;
}


/* =========================================
   BODY
   ========================================= */

body {
    margin: 0;
    min-height: 100vh;

    font-family:
        Arial,
        "Segoe UI",
        sans-serif;

    background:
        radial-gradient(
            circle at 80% 10%,
            rgba(255, 153, 51, 0.07),
            transparent 25%
        ),
        radial-gradient(
            circle at 85% 80%,
            rgba(19, 136, 8, 0.07),
            transparent 25%
        ),
        var(--bg-primary);

    color: var(--text-primary);

    overflow-x: hidden;
}


/* =========================================
   MAIN CONTAINER
   ========================================= */

.container {
    width: 100%;
    max-width: 1150px;

    margin: 0 auto;

    padding: 28px 32px 40px;
}


/* =========================================
   HEADER
   ========================================= */

.header {
    display: flex;

    justify-content: space-between;
    align-items: center;

    gap: 20px;

    padding-bottom: 18px;

    border-bottom: 1px solid var(--border);

    position: relative;
}


/* Tricolor line */

.header::after {
    content: "";

    position: absolute;

    left: 0;
    bottom: -1px;

    width: 100%;
    height: 3px;

    background:
        linear-gradient(
            90deg,
            var(--saffron) 0%,
            var(--saffron) 33%,
            var(--white) 33%,
            var(--white) 66%,
            var(--green) 66%,
            var(--green) 100%
        );

    opacity: 0.9;
}


/* =========================================
   LOGO
   ========================================= */

.logo {
    margin: 0;
    font-size: 38px;
    font-weight: 800;
    letter-spacing: 3px;
    color: var(--saffron);
    text-shadow:
        0 0 12px rgba(255, 153, 51, 0.15);
}

.logo .saffron{
    color:#FF9933;
}

.logo .white{
    color:#FFFFFF;
}

.logo .green{
    color:#138808;
}

.logo span {
    color: var(--white);
}


/* =========================================
   LANGUAGE SELECT
   ========================================= */

.language-select {
    padding: 10px 14px;

    min-width: 115px;

    border-radius: 9px;

    border: 1px solid var(--saffron);

    background: var(--bg-card);

    color: var(--text-primary);

    font-size: 14px;

    outline: none;

    cursor: pointer;

    transition: 0.25s ease;
}

.language-select:hover,
.language-select:focus {
    border-color: var(--saffron-light);

    box-shadow:
        0 0 12px rgba(255, 153, 51, 0.18);
}


/* =========================================
   TAGLINE
   ========================================= */

.tagline {
    margin: 12px 0 28px;

    color: var(--text-secondary);

    font-size: 15px;

    letter-spacing: 0.3px;
}


/* =========================================
   CARDS
   ========================================= */

.card {
    position: relative;

    background:
        linear-gradient(
            135deg,
            rgba(22, 27, 34, 0.98),
            rgba(13, 17, 23, 0.98)
        );

    padding: 25px;

    margin-bottom: 22px;

    border-radius: 14px;

    border: 1px solid var(--border);

    overflow: hidden;

    box-shadow:
        0 8px 25px rgba(0, 0, 0, 0.25);

    transition:
        border-color 0.25s ease,
        transform 0.25s ease,
        box-shadow 0.25s ease;
}


/* Tricolor glow inside cards */

.card::before {
    content: "";

    position: absolute;

    top: 0;
    right: 0;

    width: 45%;
    height: 100%;

    background:
        linear-gradient(
            135deg,
            transparent 0%,
            rgba(255, 153, 51, 0.03) 35%,
            rgba(255, 255, 255, 0.02) 50%,
            rgba(19, 136, 8, 0.04) 75%,
            transparent 100%
        );

    pointer-events: none;
}


.card:hover {
    border-color: #3a4655;

    box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.35);
}


/* =========================================
   HEADINGS
   ========================================= */

.card h2 {
    margin-top: 0;

    margin-bottom: 10px;

    font-size: 22px;

    font-weight: 700;

    color: var(--text-primary);
}

.card p {
    color: var(--text-secondary);

    line-height: 1.55;
}


/* =========================================
   SERVICE SECURITY CARD
   ========================================= */

.card:first-of-type {
    border-color:
        rgba(255, 153, 51, 0.65);
}

.card:first-of-type h2 {
    color: var(--off-white);
}


/* =========================================
   INPUTS
   ========================================= */

input {
    width: 100%;

    padding: 14px 15px;

    margin: 10px 0 15px;

    border-radius: 8px;

    border: 1px solid #3A4655;

    background: var(--bg-input);

    color: var(--text-primary);

    font-size: 15px;

    outline: none;

    transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease;
}

input::placeholder {
    color: var(--text-muted);
}

input:focus {
    border-color: var(--saffron);

    box-shadow:
        0 0 0 2px rgba(255, 153, 51, 0.12);
}


/* =========================================
   BUTTONS
   ========================================= */

button {
    padding: 12px 20px;

    border: none;

    border-radius: 8px;

    background: var(--saffron);

    color: #111827;

    font-size: 14px;

    font-weight: 700;

    cursor: pointer;

    transition:
        transform 0.2s ease,
        background 0.2s ease,
        box-shadow 0.2s ease;
}

button:hover {
    background: var(--saffron-light);

    transform: translateY(-1px);

    box-shadow:
        0 5px 15px rgba(255, 153, 51, 0.2);
}

button:active {
    transform: translateY(0);
}


/* =========================================
   OTP / IDENTITY SECTION
   ========================================= */

.card:nth-of-type(2) {
    border-color:
        rgba(19, 136, 8, 0.65);
}


/* Make OTP buttons green */

#sendOtpButton,
#verifyOtpButton {
    background: var(--green-light);

    color: #07110a;
}

#sendOtpButton:hover,
#verifyOtpButton:hover {
    background: #4ADE80;

    box-shadow:
        0 5px 15px rgba(34, 197, 94, 0.2);
}


/* =========================================
   SAFE RESULT
   ========================================= */

.safe {
    margin-top: 20px;

    padding: 20px;

    border-radius: 12px;

    border: 1px solid var(--green);

    background:
        linear-gradient(
            135deg,
            rgba(19, 136, 8, 0.14),
            rgba(22, 27, 34, 0.95)
        );

    box-shadow:
        inset 0 0 20px rgba(19, 136, 8, 0.04);
}


/* =========================================
   DANGER RESULT
   ========================================= */

.danger {
    margin-top: 20px;

    padding: 20px;

    border-radius: 12px;

    border: 1px solid var(--danger);

    background:
        linear-gradient(
            135deg,
            rgba(239, 68, 68, 0.13),
            rgba(22, 27, 34, 0.95)
        );
}


/* =========================================
   STATUS
   ========================================= */

.status {
    font-size: 21px;

    font-weight: 700;

    margin-bottom: 14px;
}


/* =========================================
   VOICE ASSISTANCE
   ========================================= */

.voice {
    margin-top: 18px;

    padding: 15px;

    background:
        rgba(32, 42, 54, 0.85);

    border-radius: 9px;

    border: 1px solid var(--border);

    color: var(--text-secondary);
}


/* Voice card button */

.voice button {
    background: var(--green-light);

    color: #07110a;
}

.voice button:hover {
    background: #4ADE80;
}


/* =========================================
   VOICE ASSISTANCE MAIN CARD
   ========================================= */

.card:nth-of-type(3) {
    border-color:
        rgba(19, 136, 8, 0.65);

    background:
        linear-gradient(

            #161B22,
            rgba(19, 136, 8, 0.07)

/* =========================================
   OTP RESULT
   ========================================= */

#otpResult {
    color: var(--text-secondary);
}


/* =========================================
   SELECTION
   ========================================= */

::selection {
    background: var(--saffron);

    color: #111827;
}


/* =========================================
   SCROLLBAR
   ========================================= */

::-webkit-scrollbar {
    width: 8px;
}

::-webkit-scrollbar-track {
    background: var(--bg-primary);
}

::-webkit-scrollbar-thumb {
    background: #263241;

    border-radius: 10px;
}

::-webkit-scrollbar-thumb:hover {
    background: #3A4655;
}


/* =========================================
   RESPONSIVE
   ========================================= */

@media (max-width: 700px) {

    .container {
        padding: 20px 15px 30px;

    .header {

    }

        border-radius: 12px;
    }

    .card h2 {
        font-size: 18px;
    }

    button {
        width: auto;

        padding: 11px 16px;
    }
}
</style>

let currentLanguage = "en";


/* =========================
   CHANGE LANGUAGE
========================= */

function changeLanguage() {

    currentLanguage =
        document.getElementById(
            "language"
        ).value;

    const t =
        translations[currentLanguage];


    document.getElementById(
        "tagline"
    ).innerText =
        t.tagline;


    document.getElementById(
        "serviceTitle"
    ).innerText =
        t.serviceTitle;


    document.getElementById(
        "serviceDescription"
    ).innerText =
        t.serviceDescription;


    document.getElementById(
        "serviceId"
    ).placeholder =
        t.servicePlaceholder;


    document.getElementById(
        "checkButton"
    ).innerText =
        t.checkButton;


    document.getElementById(
        "identityTitle"
    ).innerText =
        t.identityTitle;


    document.getElementById(
        "phone"
    ).placeholder =
        t.phonePlaceholder;


    document.getElementById(
        "sendOtpButton"
    ).innerText =
        t.sendOtp;


    document.getElementById(
        "otp"
    ).placeholder =
        t.otpPlaceholder;


    document.getElementById(
        "verifyOtpButton"
    ).innerText =
        t.verifyOtp;


    document.getElementById(
        "voiceTitle"
    ).innerText =
        t.voiceTitle;


    document.getElementById(
        "voiceButton"
    ).innerText =
        t.listen;

}



/* =========================
   VOICE
========================= */

function speak(text) {

    const speech =
        new SpeechSynthesisUtterance(text);

    const voiceLanguages = {
        en: "en-US",
        hi: "hi-IN",
        bn: "bn-IN",
        pa: "pa-IN",
        mr: "mr-IN",
        ta: "ta-IN",
        bho: "hi-IN",
        or: "or-IN"
    };

    speech.lang =
        voiceLanguages[currentLanguage];

    speech.rate = 1.0;

    speechSynthesis.speak(speech);
}

function speakWelcome() {

    speak(
        translations[
            currentLanguage
        ].welcome
    );

}



/* =========================
   CHECK SERVICE
========================= */

async function checkService() {

    const serviceId =
        document.getElementById(
            "serviceId"
        ).value.trim();


    if (!serviceId) {

        speak(
            currentLanguage === "hi"
            ? "कृपया सेवा पहचान संख्या दर्ज करें।"
            : "Please enter a service ID."
        );

        return;
    }


    try {

        const response =
            await fetch(
                API + "/api/check",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                        "application/json"
                    },

                    body:
                    JSON.stringify({

                        serviceId:
                        serviceId

                    })

                }
            );


        const data =
            await response.json();


        const result =
            document.getElementById(
                "serviceResult"
            );


        const t =
            translations[
                currentLanguage
            ];


        if (data.verified) {

            result.innerHTML = `

            <div class="safe">

                <div class="status">
                    ${t.verified}
                </div>

                <p>
                    <b>
                    ${t.organization}:
                    </b>
                    ${data.name}
                </p>

                <p>
                    <b>
                    ${t.service}:
                    </b>
                    ${data.url}
                </p>

                <p>
                    <b>
                    ${t.risk}:
                    </b>
                    ${data.risk}
                </p>

                <div class="voice">

                    🔊 ${data.message}

                    <br><br>

                    <button
                    onclick="speakVerified()">

                        ${t.listen}

                    </button>

                </div>

            </div>

            `;

            speakVerified();

        }

        else {

            result.innerHTML = `

            <div class="danger">

                <div class="status">
                    ${t.warning}
                </div>

                <p>
                    ${t.warningText}
                </p>

                <div class="voice">

                    🔊 ${t.warningText}

                    <br><br>

                    <button
                    onclick="speakWarning()">

                        ${t.listen}

                    </button>

                </div>

            </div>

            `;

            speakWarning();

        }

    }

    catch(error) {

        const t =
            translations[
                currentLanguage
            ];


        document.getElementById(
            "serviceResult"
        ).innerHTML = `

        <div class="danger">

            ${t.serverError}

        </div>

        `;

    }

}



function speakVerified() {

    const text =
        currentLanguage === "hi"

        ? "यह प्रमाणित संस्था है। आप सुरक्षित रूप से आगे बढ़ सकते हैं।"

        : "This is a verified organization. You can continue safely.";

    speak(text);

}



function speakWarning() {

    speak(
        translations[
            currentLanguage
        ].warningText
    );

}



/* =========================
   SEND OTP
========================= */

async function sendOTP() {

    const phone =
        document.getElementById(
            "phone"
        ).value.trim();


    const t =
        translations[
            currentLanguage
        ];


    if (!phone) {

        speak(
            t.invalidPhone
        );

        return;
    }


    const response =
        await fetch(
            API + "/api/send-otp",
            {

                method: "POST",

                headers: {
                    "Content-Type":
                    "application/json"
                },

                body:
                JSON.stringify({

                    phone:
                    phone

                })

            }
        );


    const data =
        await response.json();


    document.getElementById(
        "otpResult"
    ).innerHTML = `

        <p>
            ${t.otpSent}
        </p>

    `;


    if (data.demoOtp) {

        alert(
            "Demo OTP: " +
            data.demoOtp
        );

    }

}



/* =========================
   VERIFY OTP
========================= */

async function verifyOTP() {

    const phone =
        document.getElementById(
            "phone"
        ).value.trim();


    const otp =
        document.getElementById(
            "otp"
        ).value.trim();


    const response =
        await fetch(
            API + "/api/verify-otp",
            {

                method: "POST",

                headers: {
                    "Content-Type":
                    "application/json"
                },

                body:
                JSON.stringify({

                    phone:
                    phone,

                    otp:
                    otp

                })

            }
        );


    const data =
        await response.json();


    const t =
        translations[
            currentLanguage
        ];


    if (data.verified) {

        document.getElementById(
            "otpResult"
        ).innerHTML = `

        <div class="safe">

            <div class="status">

                ${t.identityVerified}

            </div>

            <p>
                ${t.identityVerified}
            </p>

        </div>

        `;


        speak(
            currentLanguage === "hi"

            ? "आपकी पहचान सफलतापूर्वक सत्यापित हो गई।"

            : "Your identity has been successfully verified."
        );

    }

    else {

        let message;


        if (
            data.message.includes(
                "expired"
            )
        ) {

            message =
                t.otpExpired;

        }

        else if (
            data.message.includes(
                "Incorrect"
            ) ||
            data.message.includes(
                "गलत"
            )
        ) {

            message =
                t.otpWrong;

        }

        else {

            message =
                t.otpUnavailable;

        }


        document.getElementById(
            "otpResult"
        ).innerHTML = `

        <div class="danger">

            🔴 ${message}

        </div>

        `;

    }

}
