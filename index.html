<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #07111f, #102a40);
    color: white;
    min-height: 100vh;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 30px;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
}

.logo {
    font-size: 40px;
    font-weight: bold;
    letter-spacing: 3px;
}

.logo span {
    color: #ff9500, rgb(251, 251, 251), #006113;
}

.language-select {
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid #40556a;
    background: #101e2d;
    color: white;
    font-size: 15px;
}

.tagline {
    color: #9fb0c0;
    margin-bottom: 35px;
}

.card {
    background: #101e2d;
    padding: 25px;
    margin-bottom: 25px;
    border-radius: 18px;
    border: 1px solid rgba(255,255,255,0.1);
}

input {
    width: 100%;
    padding: 14px;
    margin: 10px 0 15px;
    border-radius: 10px;
    border: 1px solid #40556a;
    background: #071522;
    color: white;
    font-size: 16px;
}

button {
    padding: 13px 20px;
    border: none;
    border-radius: 10px;
    background: #19d7b8;
    color: #041018;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    opacity: 0.85;
}

.safe {
    margin-top: 20px;
    padding: 20px;
    border-radius: 15px;
    border: 2px solid #19d7b8;
    background: #0c302b;
}

.danger {
    margin-top: 20px;
    padding: 20px;
    border-radius: 15px;
    border: 2px solid #ff5555;
    background: #321719;
}

.status {
    font-size: 25px;
    font-weight: bold;
    margin-bottom: 15px;
}

.voice {
    margin-top: 15px;
    padding: 15px;
    background: #182b3d;
    border-radius: 10px;
}

</style>

</head>

        "சேவை ID-ஐ உள்ளிடவும், உதாரணம் TF001",

        "சேவையைச் சரிபார்க்கவும்",

        identityTitle:
        "📱 அடையாள சரிபார்ப்பு",

        "மொபைல் எண்ணை உள்ளிடவும்",

        sendOtp:
        "OTP அனுப்பவும்",

        otpPlaceholder:
        "OTP-ஐ உள்ளிடவும்",

        verifyOtp:
        "OTP-ஐ சரிபார்க்கவும்",

        voiceTitle:
        "🔊 குரல் உதவி",

        listen:
        "🔊 கேட்கவும்",

        welcome:
        "டிரஸ்ட்ஃபோர்ஜ்-க்கு வரவேற்கிறோம். எந்த டிஜிட்டல் சேவையையும் பயன்படுத்துவதற்கு முன்பு அதன் அடையாளத்தைச் சரிபார்க்கவும்.",

        verified:
        "🟢 சேவை சரிபார்க்கப்பட்டது",

        organization:
        "நிறுவனம்",

        service:
        "சேவை",

        risk:
        "ஆபத்து நிலை",

        warning:
        "🔴 எச்சரிக்கை",

};


let currentLanguage = "en";


/* =========================
   CHANGE LANGUAGE
========================= */

function changeLanguage() {

    currentLanguage =
        document.getElementById(
            "language"
        ).value;

    const t =
        translations[currentLanguage];


    document.getElementById(
        "tagline"
    ).innerText =
        t.tagline;


    document.getElementById(
        "serviceTitle"
    ).innerText =
        t.serviceTitle;


    document.getElementById(
        "serviceDescription"
    ).innerText =
        t.serviceDescription;


    document.getElementById(
        "serviceId"
    ).placeholder =
        t.servicePlaceholder;


    document.getElementById(
        "checkButton"
    ).innerText =
        t.checkButton;


    document.getElementById(
        "identityTitle"
    ).innerText =
        t.identityTitle;


    document.getElementById(
        "phone"
    ).placeholder =
        t.phonePlaceholder;


    document.getElementById(
        "sendOtpButton"
    ).innerText =
        t.sendOtp;


    document.getElementById(
        "otp"
    ).placeholder =
        t.otpPlaceholder;


    document.getElementById(
        "verifyOtpButton"
    ).innerText =
        t.verifyOtp;


    document.getElementById(
        "voiceTitle"
    ).innerText =
        t.voiceTitle;


    document.getElementById(
        "voiceButton"
    ).innerText =
        t.listen;

}



/* =========================
   VOICE
========================= */

function speak(text) {

    const speech =
        new SpeechSynthesisUtterance(text);

    const voiceLanguages = {
        en: "en-US",
        hi: "hi-IN",
        bn: "bn-IN",
        pa: "pa-IN",
        mr: "mr-IN",
        ta: "ta-IN",
        bho: "hi-IN",
        or: "or-IN"
    };

    speech.lang =
        voiceLanguages[currentLanguage];

    speech.rate = 1.0;

    speechSynthesis.speak(speech);
}

function speakWelcome() {

    speak(
        translations[
            currentLanguage
        ].welcome
    );

}



/* =========================
   CHECK SERVICE
========================= */

async function checkService() {

    const serviceId =
        document.getElementById(
            "serviceId"
        ).value.trim();


    if (!serviceId) {

        speak(
            currentLanguage === "hi"
            ? "कृपया सेवा पहचान संख्या दर्ज करें।"
            : "Please enter a service ID."
        );

        return;
    }


    try {

        const response =
            await fetch(
                API + "/api/check",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                        "application/json"
                    },

                    body:
                    JSON.stringify({

                        serviceId:
                        serviceId

                    })

                }
            );


        const data =
            await response.json();


        const result =
            document.getElementById(
                "serviceResult"
            );


        const t =
            translations[
                currentLanguage
            ];


        if (data.verified) {

            result.innerHTML = `

            <div class="safe">

                <div class="status">
                    ${t.verified}
                </div>

                <p>
                    <b>
                    ${t.organization}:
                    </b>
                    ${data.name}
                </p>

                <p>
                    <b>
                    ${t.service}:
                    </b>
                    ${data.url}
                </p>

                <p>
                    <b>
                    ${t.risk}:
                    </b>
                    ${data.risk}
                </p>

                <div class="voice">

                    🔊 ${data.message}

                    <br><br>

                    <button
                    onclick="speakVerified()">

                        ${t.listen}

                    </button>

                </div>

            </div>

            `;

            speakVerified();

        }

        else {

            result.innerHTML = `

            <div class="danger">

                <div class="status">
                    ${t.warning}
                </div>

                <p>
                    ${t.warningText}
                </p>

                <div class="voice">

                    🔊 ${t.warningText}

                    <br><br>

                    <button
                    onclick="speakWarning()">

                        ${t.listen}

                    </button>

                </div>

            </div>

            `;

            speakWarning();

        }

    }

    catch(error) {

        const t =
            translations[
                currentLanguage
            ];


        document.getElementById(
            "serviceResult"
        ).innerHTML = `

        <div class="danger">

            ${t.serverError}

        </div>

        `;

    }

}



function speakVerified() {

    const text =
        currentLanguage === "hi"

        ? "यह प्रमाणित संस्था है। आप सुरक्षित रूप से आगे बढ़ सकते हैं।"

        : "This is a verified organization. You can continue safely.";

    speak(text);

}



function speakWarning() {

    speak(
        translations[
            currentLanguage
        ].warningText
    );

}



/* =========================
   SEND OTP
========================= */

async function sendOTP() {

    const phone =
        document.getElementById(
            "phone"
        ).value.trim();


    const t =
        translations[
            currentLanguage
        ];


    if (!phone) {

        speak(
            t.invalidPhone
        );

        return;
    }


    const response =
        await fetch(
            API + "/api/send-otp",
            {

                method: "POST",

                headers: {
                    "Content-Type":
                    "application/json"
                },

                body:
                JSON.stringify({

                    phone:
                    phone

                })

            }
        );


    const data =
        await response.json();


    document.getElementById(
        "otpResult"
    ).innerHTML = `

        <p>
            ${t.otpSent}
        </p>

    `;


    if (data.demoOtp) {

        alert(
            "Demo OTP: " +
            data.demoOtp
        );

    }

}



/* =========================
   VERIFY OTP
========================= */

async function verifyOTP() {

    const phone =
        document.getElementById(
            "phone"
        ).value.trim();


    const otp =
        document.getElementById(
            "otp"
        ).value.trim();


    const response =
        await fetch(
            API + "/api/verify-otp",
            {

                method: "POST",

                headers: {
                    "Content-Type":
                    "application/json"
                },

                body:
                JSON.stringify({

                    phone:
                    phone,

                    otp:
                    otp

                })

            }
        );


    const data =
        await response.json();


    const t =
        translations[
            currentLanguage
        ];


    if (data.verified) {

        document.getElementById(
            "otpResult"
        ).innerHTML = `

        <div class="safe">

            <div class="status">

                ${t.identityVerified}

            </div>

            <p>
                ${t.identityVerified}
            </p>

        </div>

        `;


        speak(
            currentLanguage === "hi"

            ? "आपकी पहचान सफलतापूर्वक सत्यापित हो गई।"

            : "Your identity has been successfully verified."
        );

    }

    else {

        let message;


        if (
            data.message.includes(
                "expired"
            )
        ) {

            message =
                t.otpExpired;

        }

        else if (
            data.message.includes(
                "Incorrect"
            ) ||
            data.message.includes(
                "गलत"
            )
        ) {

            message =
                t.otpWrong;

        }

        else {

            message =
                t.otpUnavailable;

        }


        document.getElementById(
            "otpResult"
        ).innerHTML = `

        <div class="danger">

            🔴 ${message}

        </div>

        `;

    }

}

</script>
